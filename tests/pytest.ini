[pytest]
# HMS Security Lab — pytest configuration

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    xfail: marks tests that document a known vulnerability in the insecure app

# Timeout — prevent hung tests if a container is not running
# pip install pytest-timeout to enable
# timeout = 10
