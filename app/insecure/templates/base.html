<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMS Training Lab — INSECURE</title>
  <!-- VULN-10: No security headers (no CSP, no X-Frame-Options, etc.) -->
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fff0f0; }
    .banner { background: #cc0000; color: white; padding: 8px 20px; font-size: 13px; }
    nav { background: #333; padding: 10px 20px; }
    nav a { color: white; margin-right: 15px; text-decoration: none; }
    .content { padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    .btn { padding: 6px 14px; background: #333; color: white;
           border: none; cursor: pointer; text-decoration: none; }
    input[type=text], input[type=password], textarea {
      padding: 6px; width: 250px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div class="banner">⚠️  INSECURE TRAINING VERSION — LOCAL USE ONLY — DO NOT DEPLOY</div>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/patients">Patients</a>
    {% if session.role in ['admin', 'doctor'] %}
    <a href="/admin">Admin</a>
    {% endif %}
    <a href="/logout">Logout ({{ session.username }})</a>
  </nav>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
